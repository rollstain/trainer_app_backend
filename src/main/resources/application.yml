spring:
  application:
    name: trainer-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trainer}
    username: ${DB_USER:trainer}
    password: ${DB_PASSWORD:trainer}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  task:
    execution:
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 1000

server:
  port: ${SERVER_PORT:8080}

trainer:
  auth:
    access-token-ttl-minutes: 15
    refresh-token-idle-days: 90
    refresh-token-absolute-days: 365
    refresh-rotation-grace-seconds: 60
    invite-ttl-hours: 168
    jwt-secret: ${JWT_SECRET:}
    admin-token: ${TRAINER_ADMIN_TOKEN:}
    external:
      vk-client-id: ${VK_CLIENT_ID:}
      apple-client-id: ${APPLE_CLIENT_ID:}
      google-client-id: ${GOOGLE_CLIENT_ID:}
  telegram:
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    bot-secret: ${TELEGRAM_BOT_SECRET:}
  links:
    android-package: ${ANDROID_PACKAGE:app.trainer.android}
    android-sha256: ${ANDROID_SHA256:}
    app-download-url: ${APP_DOWNLOAD_URL:https://api.lyashukfit.ru/i/download}
  push:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  media:
    bucket: ${MEDIA_BUCKET:trainer-media}
    endpoint: ${MEDIA_ENDPOINT:}
    region: ${MEDIA_REGION:ru-central1}
    access-key: ${MEDIA_ACCESS_KEY:}
    secret-key: ${MEDIA_SECRET_KEY:}
    upload-url-lifetime-minutes: 15
    download-url-lifetime-minutes: 60
    max-file-size-bytes: 26214400
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/heic
      - image/webp
      - video/mp4
      - video/quicktime
      - application/pdf

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
