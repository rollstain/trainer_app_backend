name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Бэкенд — анализ, тесты, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Миграции не переопределяют существующие объекты
        run: python3 scripts/check_migrations.py

      - name: Статический анализ
        run: ./gradlew detekt --console=plain

      - name: Тесты
        run: ./gradlew test --console=plain

      - name: Сборка jar
        run: ./gradlew bootJar --console=plain

      - name: Отчёты о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore

  dependencies:
    name: Проверка новых зависимостей
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Уязвимости и лицензии
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
