name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Тег или ветка, которую выкатываем
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Выкатка на прод
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Миграции не переопределяют существующие объекты
        run: python3 scripts/check_migrations.py

      - name: Тесты
        run: ./gradlew test --console=plain

      - name: Сборка jar
        run: ./gradlew bootJar --console=plain

      - name: Доступ к серверу
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Выкатка, проверка живости и откат при провале
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          built_jar=$(find build/libs -name '*.jar' -not -name '*-plain.jar' -print -quit)
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" /opt/trainer/ci_deploy.sh < "$built_jar"

      - name: Уведомление в Telegram
        if: always() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            ./scripts/telegram_notify.sh "trainer_backend · выкатка ${{ inputs.ref }} на прод прошла"
          else
            ./scripts/telegram_notify.sh "trainer_backend · выкатка ${{ inputs.ref }} провалилась, смотрите прогон"
          fi
